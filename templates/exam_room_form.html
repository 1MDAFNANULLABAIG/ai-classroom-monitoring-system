{% extends "base.html" %}
{% block title %}Edit Exam Room{% endblock %}
{% block content %}
<h1>Edit Exam Room</h1>

<div class="panel">
<form method="POST">
    <label>Room Name</label>
    <input type="text" name="room_name" value="{{ room.room_name }}" required>

    <label>Capacity</label>
    <input type="number" name="capacity" min="1" value="{{ room.capacity }}" style="max-width:120px;">

    <label>Location</label>
    <input type="text" name="location" value="{{ room.location or '' }}">

    <button type="submit" class="btn btn-primary" style="margin-top:16px;">Save Changes</button>
    <a href="{{ url_for('exam_rooms') }}" class="btn btn-secondary">Cancel</a>
</form>
</div>
{% endblock %}
